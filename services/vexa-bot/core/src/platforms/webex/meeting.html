<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webex SDK Host</title>
</head>
<body>
  <h1>Webex Meeting Bot</h1>
  <div id="status">Initializing...</div>
  
  <!-- Load Webex SDK from CDN -->
  <!-- Pin SDK version to avoid unexpected breakage from minor releases -->
  <script crossorigin="anonymous" integrity="sha384-AStSRbsq4tv/850MxukZeFavu5RvbyTN7jCR+imXMviF+lQWiP+xNwAHV1IgVinv" src="https://unpkg.com/webex@3.7.0/umd/webex.min.js"></script>
  <script>
    if (!window.Webex) {
      document.getElementById('status').textContent = 'ERROR: Webex SDK failed to load from CDN';
      console.error('[WEBEX] SDK failed to load from unpkg.com CDN');
    }
  </script>
  
  <script>
    // Global state exposed to Playwright
    window.__WEBEX_STATUS = {
      initialized: false,
      registered: false,
      meetingCreated: false,
      joinSignaled: false,
      joined: false,
      inLobby: false,
      audioReady: false,
      meetingState: null,
      error: null,
      removed: false,
      ended: false,
      removalReason: null
    };
    
    window.__WEBEX_LOGS = [];
    window.__WEBEX_AUDIO_STREAM = null;
    window.__WEBEX_INSTANCE = null;
    window.__WEBEX_MEETING = null;
    // SECURITY NOTE: The access_token is exposed in browser context via __WEBEX_CONFIG.
    // This is inherent to the Webex JS SDK architecture (client-side only).
    // Mitigations: page runs in headless Playwright with no user-facing content,
    // and the local HTTP server binds to 127.0.0.1 only.
    window.__WEBEX_CONFIG = null;
    
    function log(message, data) {
      const logEntry = {
        timestamp: new Date().toISOString(),
        message,
        data: data || null
      };
      window.__WEBEX_LOGS.push(logEntry);
      console.log(`[WEBEX] ${message}`, data || '');
      const statusDiv = document.getElementById('status');
      if (statusDiv) {
        statusDiv.textContent = message;
      }
    }
    
    // Initialize Webex and join meeting
    window.initWebex = async function() {
      try {
        if (!window.__WEBEX_CONFIG) {
          throw new Error('Missing __WEBEX_CONFIG (access_token and meetingUrl required)');
        }
        
        log('Initializing Webex SDK...');
        
        const webex = window.Webex.init({
          credentials: {
            access_token: window.__WEBEX_CONFIG.access_token
          }
        });
        
        window.__WEBEX_INSTANCE = webex;
        window.__WEBEX_STATUS.initialized = true;
        log('SDK initialized');
        
        // Wait for meetings plugin to be fully ready before registering.
        // The meetings plugin bootstraps asynchronously; calling register()
        // before it's ready causes "Cannot read properties of undefined
        // (reading 'internal')" errors.
        log('Waiting for meetings:ready event...');
        await new Promise((resolve, reject) => {
          const timeout = setTimeout(() => reject(new Error('meetings:ready timed out after 30s')), 30000);
          webex.meetings.on('meetings:ready', () => {
            clearTimeout(timeout);
            log('meetings:ready received');
            resolve();
          });
        });
        
        // Register with Webex
        log('Registering with Webex...');
        await webex.meetings.register();
        window.__WEBEX_STATUS.registered = true;
        log('Registration successful');
        
        // Create meeting
        const destination = window.__WEBEX_CONFIG.meetingUrl;
        log('Creating meeting...', { destination });
        const meeting = await webex.meetings.create(destination);
        window.__WEBEX_MEETING = meeting;
        window.__WEBEX_STATUS.meetingCreated = true;
        log('Meeting created', { meetingId: meeting.id });
        
        // Log ALL events from the meeting object to discover admission signals
        const originalEmit = meeting.emit.bind(meeting);
        meeting.emit = function(event, ...args) {
          log('EVENT: ' + event, args.length > 0 ? JSON.stringify(args[0]).substring(0, 200) : '');
          return originalEmit(event, ...args);
        };

        // Bind event handlers
        meeting.on('media:ready', (media) => {
          log('Media ready', { type: media.type });
          
          if (media.type === 'remoteAudio') {
            window.__WEBEX_AUDIO_STREAM = media.stream;
            window.__WEBEX_STATUS.audioReady = true;
            
            // CRITICAL: Attach stream to an <audio> element so Chrome
            // actually decodes WebRTC RTP packets. Without this,
            // MediaStreamSource/AudioContext sees all zeros.
            const audioEl = document.createElement('audio');
            audioEl.srcObject = media.stream;
            audioEl.autoplay = true;
            // volume=0 prevents audible output without using .muted
            // (.muted can cause Chrome to skip RTP decode entirely)
            audioEl.volume = 0;
            document.body.appendChild(audioEl);
            audioEl.play().catch(e => log('Audio element play error', { error: e.message }));
            
            log('Remote audio stream available', {
              tracks: media.stream.getTracks().length,
              trackInfo: media.stream.getTracks().map(t => ({
                kind: t.kind,
                id: t.id,
                label: t.label,
                enabled: t.enabled,
                muted: t.muted,
                readyState: t.readyState
              }))
            });
          }
        });
        
        meeting.on('media:stopped', (media) => {
          log('Media stopped', { type: media.type });
          if (media.type === 'remoteAudio') {
            window.__WEBEX_AUDIO_STREAM = null;
            window.__WEBEX_STATUS.audioReady = false;
            // Remote audio stopped is a strong signal the meeting ended
            log('Remote audio stopped — setting ended=true');
            window.__WEBEX_STATUS.ended = true;
          }
        });
        
        meeting.on('error', (err) => {
          log('Meeting error', { error: err.message });
          window.__WEBEX_STATUS.error = err.message;
        });
        
        meeting.on('meeting:stateChange', (state) => {
          // state can be {payload: {currentState, previousState}} or a string
          const payload = state && state.payload ? state.payload : state;
          const current = String(payload.currentState || payload.current || payload).toUpperCase();
          log('Meeting state changed', { current, raw: JSON.stringify(state).slice(0, 200) });
          window.__WEBEX_STATUS.meetingState = current;
          
          // Mark as joined when meeting reaches an active (non-lobby) state.
          if (current === 'JOINED' || current === 'ACTIVE' || current === 'IN_MEETING') {
            window.__WEBEX_STATUS.joined = true;
            log('Meeting state indicates admission — joined=true');
          }
          
          // Detect meeting end via state change (meeting:ended may not always fire)
          if (current === 'INACTIVE' || current === 'TERMINATING' || current === 'ENDED' || current === 'LEFT') {
            log('Meeting state indicates end — setting ended=true');
            window.__WEBEX_STATUS.ended = true;
          }
        });
        
        // Lobby detection: SDK fires meeting:self:lobbyWaiting when placed in lobby
        meeting.on('meeting:self:lobbyWaiting', (payload) => {
          log('Bot is in lobby (meeting:self:lobbyWaiting)', payload);
          window.__WEBEX_STATUS.inLobby = true;
        });
        
        // CRITICAL: SDK fires meeting:self:guestAdmitted when host admits from lobby
        meeting.on('meeting:self:guestAdmitted', (payload) => {
          log('Bot admitted from lobby (meeting:self:guestAdmitted)', payload);
          window.__WEBEX_STATUS.inLobby = false;
          window.__WEBEX_STATUS.joined = true;
          log('Admission detected — joined=true');
        });
        
        // Fallback: members:update as a secondary signal
        meeting.on('members:update', (delta) => {
          log('Members updated', {
            added: delta?.added?.length || 0,
            removed: delta?.removed?.length || 0,
            total: meeting.members?.membersCollection?.length || 0
          });
        });
        
        meeting.on('meeting:removed', (reason) => {
          log('Bot was removed from meeting', reason);
          window.__WEBEX_STATUS.removed = true;
          window.__WEBEX_STATUS.removalReason = reason?.type || 'unknown';
        });
        
        meeting.on('meeting:ended', () => {
          log('Meeting ended by host');
          window.__WEBEX_STATUS.ended = true;
        });
        
        // (members:update handler is above with admission detection)
        
        // Track active speaker changes
        meeting.on('meeting:activeSpeakerChanged', (payload) => {
          const speaker = payload.activeSpeaker;
          log('Active speaker changed', {
            speakerId: speaker?.id,
            speakerName: speaker?.name
          });
        });
        
        // Join meeting (signaling only — media is set up separately via addMedia)
        log('Joining meeting...');
        
        if (window.__WEBEX_CONFIG.displayName) {
          log('Using display name: ' + window.__WEBEX_CONFIG.displayName);
        }
        
        await meeting.join();
        window.__WEBEX_STATUS.joinSignaled = true;
        log('Join signaling complete (may be in lobby — joined flag deferred)');
        
        // Don't set joined=true here! meeting.join() resolves even when
        // the bot is placed in a lobby/waiting room. The joined flag is
        // set by the meeting:stateChange handler when the meeting reaches
        // an active state, or by admission.ts after successfully adding media.
        
        return { success: true };
        
      } catch (err) {
        log('Error during initialization', { error: err.message });
        window.__WEBEX_STATUS.error = err.message;
        throw err;
      }
    };
    
    // Add media (call after admission/lobby)
    window.addMeetingMedia = async function() {
      try {
        if (!window.__WEBEX_MEETING) {
          throw new Error('No active meeting — call initWebex first');
        }
        log('Adding media (receive audio only, no video)...');
        // Webex JS SDK v3.x API: pass no localStreams and disable video
        // to avoid H264 codec requirement in headless Chrome.
        // audioEnabled=true ensures remote audio is received even without
        // a local microphone stream. videoEnabled=false prevents the SDK
        // from adding a video m-line to the SDP offer entirely.
        await window.__WEBEX_MEETING.addMedia({
          localStreams: {},
          audioEnabled: true,
          videoEnabled: false,
          shareAudioEnabled: false,
          shareVideoEnabled: false,
          allowMediaInLobby: true
        });
        log('Media added successfully');
        return { success: true };
      } catch (err) {
        log('Error adding media', { error: err.message });
        throw err;
      }
    };
    
    // Leave meeting
    window.leaveMeeting = async function() {
      try {
        if (window.__WEBEX_MEETING) {
          log('Leaving meeting...');
          await window.__WEBEX_MEETING.leave();
          log('Left meeting successfully');
          return { success: true };
        } else {
          log('No active meeting to leave');
          return { success: false, reason: 'no_active_meeting' };
        }
      } catch (err) {
        log('Error leaving meeting', { error: err.message });
        throw err;
      }
    };
    
    // Get audio stream
    window.getAudioStream = function() {
      return window.__WEBEX_AUDIO_STREAM;
    };
    
    // Get meeting status
    window.getMeetingStatus = function() {
      return window.__WEBEX_STATUS;
    };
    
    // Get participant count
    window.getParticipantCount = function() {
      try {
        const meeting = window.__WEBEX_MEETING;
        if (meeting && meeting.members && meeting.members.membersCollection) {
          return meeting.members.membersCollection.length;
        }
        return 0;
      } catch (err) {
        log('Error getting participant count', { error: err.message });
        return 0;
      }
    };
    
    log('Page loaded, waiting for config...');
  </script>
</body>
</html>
