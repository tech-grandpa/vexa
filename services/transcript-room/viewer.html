<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scribe — Live Transcript</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #0a0c10;
  --bg-surface: #11141a;
  --bg-elevated: #181c25;
  --bg-hover: #1e2330;
  --border: #252a36;
  --border-subtle: #1a1f2a;
  --text-primary: #d4d8e0;
  --text-secondary: #7a8294;
  --text-muted: #4a5168;
  --teal: #00e5cc;
  --teal-dim: #00b8a3;
  --teal-glow: #00e5cc22;
  --amber: #d4a020;
  --amber-dim: #b8891a;
  --amber-glow: #d4a02018;
  --red: #d94030;
  --red-dim: #b8342a;
  --red-glow: #d9403020;
  --speaker-1: #c8a0e8;
  --speaker-2: #6bc5d4;
  --speaker-3: #e8a87c;
  --speaker-4: #8cc084;
  --speaker-5: #d4a0a0;
  --speaker-6: #a0b8d4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { font-size: 15px; }

body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: 'DM Sans', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Subtle noise texture overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 100;
}

/* Ambient glow from top-left */
body::after {
  content: '';
  position: fixed;
  top: -20%;
  left: -10%;
  width: 50%;
  height: 50%;
  background: radial-gradient(ellipse, var(--teal-glow) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ── Header ───────────────────────────────────────────── */
header {
  position: relative;
  z-index: 10;
  padding: 18px 28px 16px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg-surface) 100%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dim) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  box-shadow: 0 0 16px var(--teal-glow), 0 2px 4px #0004;
}

.logo-text {
  font-family: 'Playfair Display', serif;
  font-weight: 800;
  font-size: 20px;
  color: #e8ecf2;
  letter-spacing: -0.5px;
}

.separator {
  width: 1px;
  height: 20px;
  background: var(--border);
  margin: 0 2px;
}

.meeting-label {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 400;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.participant-count {
  font-size: 12px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 300;
}

#status {
  font-size: 12px;
  font-weight: 500;
  padding: 5px 14px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 7px;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  transition: all 0.4s ease;
}

#status.live {
  background: var(--red-glow);
  color: var(--red);
  border: 1px solid #d9403030;
}

#status.live .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--red);
  animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  box-shadow: 0 0 6px var(--red);
}

#status.ended {
  background: var(--amber-glow);
  color: var(--amber);
  border: 1px solid #d4a02020;
}

#status.connecting {
  background: var(--bg-hover);
  color: var(--text-muted);
  border: 1px solid var(--border);
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.3; transform: scale(0.85); }
}

/* ── Waveform decoration ─────────────────────────────── */
.waveform-bar {
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, var(--teal) 20%, var(--teal-dim) 50%, var(--amber) 80%, transparent 100%);
  opacity: 0.25;
  flex-shrink: 0;
}

/* ── Transcript area ──────────────────────────────────── */
#transcript {
  flex: 1;
  overflow-y: auto;
  padding: 20px 0;
  position: relative;
  z-index: 1;
  scroll-behavior: smooth;
}

#transcript::-webkit-scrollbar { width: 6px; }
#transcript::-webkit-scrollbar-track { background: transparent; }
#transcript::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
#transcript::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

.segment {
  padding: 8px 32px;
  display: flex;
  gap: 0;
  align-items: baseline;
  transition: background 0.2s ease;
  animation: segIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.segment:hover {
  background: var(--bg-hover);
}

@keyframes segIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

.seg-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 300;
  color: var(--text-muted);
  min-width: 70px;
  flex-shrink: 0;
  padding-top: 2px;
  user-select: none;
}

.seg-speaker {
  font-weight: 600;
  font-size: 13px;
  min-width: 110px;
  flex-shrink: 0;
  padding-right: 16px;
  text-align: right;
  user-select: none;
}

.seg-text {
  color: var(--text-primary);
  font-size: 14.5px;
  line-height: 1.65;
  flex: 1;
}

/* Speaker color cycling */
.seg-speaker[data-color="0"] { color: var(--speaker-1); }
.seg-speaker[data-color="1"] { color: var(--speaker-2); }
.seg-speaker[data-color="2"] { color: var(--speaker-3); }
.seg-speaker[data-color="3"] { color: var(--speaker-4); }
.seg-speaker[data-color="4"] { color: var(--speaker-5); }
.seg-speaker[data-color="5"] { color: var(--speaker-6); }

/* Group consecutive same-speaker segments */
.segment.continuation .seg-speaker {
  visibility: hidden;
}
.segment.continuation .seg-time {
  opacity: 0.4;
}

/* ── Empty state ──────────────────────────────────────── */
#empty-state {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 1;
  transition: opacity 0.5s ease;
}

#empty-state.hidden { opacity: 0; pointer-events: none; }

.empty-icon {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}

.empty-title {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 18px;
  color: var(--text-secondary);
}

.empty-sub {
  font-size: 13px;
  color: var(--text-muted);
}

/* Listening animation */
.listening-dots {
  display: flex;
  gap: 4px;
  margin-top: 4px;
}
.listening-dots span {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--teal-dim);
  animation: listenBounce 1.4s ease-in-out infinite;
}
.listening-dots span:nth-child(2) { animation-delay: 0.16s; }
.listening-dots span:nth-child(3) { animation-delay: 0.32s; }

@keyframes listenBounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
  40% { transform: scale(1); opacity: 1; }
}

/* ── Scroll-to-bottom button ──────────────────────────── */
#scrollBtn {
  display: none;
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-elevated);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 8px 20px;
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  cursor: pointer;
  z-index: 50;
  box-shadow: 0 4px 20px #0006;
  transition: all 0.2s ease;
  letter-spacing: 0.2px;
}
#scrollBtn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
  border-color: var(--text-muted);
}

/* ── Footer / stats bar ──────────────────────────────── */
footer {
  position: relative;
  z-index: 10;
  padding: 10px 28px;
  border-top: 1px solid var(--border);
  background: var(--bg-surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.footer-left, .footer-right {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 300;
  color: var(--text-muted);
}

.footer-stat {
  display: flex;
  align-items: center;
  gap: 5px;
}

.footer-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--teal-dim);
  opacity: 0.5;
}

.footer-brand {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: -0.3px;
}

/* ── Responsive ──────────────────────────────────────── */
@media (max-width: 680px) {
  header { padding: 14px 16px; }
  .separator, .meeting-label, .participant-count { display: none; }
  .segment { padding: 6px 16px; flex-wrap: wrap; }
  .seg-time { min-width: unset; margin-right: 8px; }
  .seg-speaker { min-width: unset; text-align: left; padding-right: 8px; }
  .seg-text { flex-basis: 100%; padding-left: 0; margin-top: 2px; }
  footer { padding: 8px 16px; }
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <span class="logo-text">Scribe</span>
    </div>
    <div class="separator"></div>
    <span class="meeting-label" id="meetingLabel">Live Transcript</span>
  </div>
  <div class="header-right">
    <span class="participant-count" id="participants"></span>
    <div id="status" class="connecting"><span>Connecting</span></div>
  </div>
</header>

<div class="waveform-bar"></div>

<div id="transcript">
  <div id="empty-state">
    <div class="empty-icon">🎙</div>
    <div class="empty-title">Waiting for speech…</div>
    <div class="empty-sub">Transcript will appear here as people speak</div>
    <div class="listening-dots">
      <span></span><span></span><span></span>
    </div>
  </div>
</div>

<button id="scrollBtn" onclick="scrollToBottom()">↓ New messages below</button>

<footer>
  <div class="footer-left">
    <span class="footer-stat"><span class="footer-dot"></span><span id="segCount">0 segments</span></span>
    <span class="footer-stat" id="duration"></span>
  </div>
  <div class="footer-right">
    <span class="footer-brand">Scribe</span>
  </div>
</footer>

<script>
const TOKEN = '__TOKEN__';
const tx = document.getElementById('transcript');
const st = document.getElementById('status');
const sb = document.getElementById('scrollBtn');
const emptyState = document.getElementById('empty-state');
const segCountEl = document.getElementById('segCount');
const durationEl = document.getElementById('duration');

let userScrolled = false;
let ended = false;
let endedAt = null;
let ttl = 0;
let segCount = 0;
let firstTimestamp = null;
let lastSpeaker = null;

// Speaker color map
const speakerColors = new Map();
let colorIdx = 0;
function getSpeakerColor(name) {
  if (!name) return '0';
  if (!speakerColors.has(name)) {
    speakerColors.set(name, colorIdx % 6);
    colorIdx++;
  }
  return String(speakerColors.get(name));
}

function scrollToBottom() {
  tx.scrollTop = tx.scrollHeight;
  userScrolled = false;
  sb.style.display = 'none';
}

tx.addEventListener('scroll', () => {
  const d = tx.scrollHeight - tx.clientHeight - tx.scrollTop;
  userScrolled = d > 100;
  sb.style.display = userScrolled ? 'block' : 'none';
});

function addLine(seg) {
  emptyState.classList.add('hidden');
  segCount++;
  segCountEl.textContent = segCount + ' segment' + (segCount === 1 ? '' : 's');

  const t = new Date(seg.timestamp);
  const ts = t.toTimeString().slice(0, 8);
  if (!firstTimestamp) firstTimestamp = t;

  const isContinuation = seg.speaker && seg.speaker === lastSpeaker;
  lastSpeaker = seg.speaker || null;

  const div = document.createElement('div');
  div.className = 'segment' + (isContinuation ? ' continuation' : '');

  const timeEl = document.createElement('span');
  timeEl.className = 'seg-time';
  timeEl.textContent = ts;

  const speakerEl = document.createElement('span');
  speakerEl.className = 'seg-speaker';
  if (seg.speaker) {
    speakerEl.setAttribute('data-color', getSpeakerColor(seg.speaker));
    speakerEl.textContent = seg.speaker;
  }

  const textEl = document.createElement('span');
  textEl.className = 'seg-text';
  textEl.textContent = seg.text;

  div.appendChild(timeEl);
  div.appendChild(speakerEl);
  div.appendChild(textEl);
  tx.appendChild(div);

  if (!userScrolled) scrollToBottom();
  updateDuration();
}

function updateDuration() {
  if (!firstTimestamp) return;
  const now = new Date();
  const diff = Math.floor((now - firstTimestamp) / 1000);
  const m = Math.floor(diff / 60);
  const s = diff % 60;
  durationEl.textContent = m + ':' + String(s).padStart(2, '0') + ' elapsed';
}

function updateStatus() {
  if (ended) {
    st.className = 'ended';
    if (endedAt && ttl) {
      const exp = new Date(new Date(endedAt).getTime() + ttl * 60000);
      const min = Math.max(0, Math.round((exp - Date.now()) / 60000));
      st.innerHTML = '<span>Expires in ' + min + 'min</span>';
    } else {
      st.innerHTML = '<span>Ended</span>';
    }
  }
}

function connect() {
  st.className = 'connecting';
  st.innerHTML = '<span>Connecting</span>';

  const es = new EventSource('/api/room/' + TOKEN + '/stream');

  es.onopen = () => {
    if (!ended) {
      st.className = 'live';
      st.innerHTML = '<span class="dot"></span><span>Live</span>';
    }
  };

  es.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.type === 'segment') addLine(d);
    else if (d.type === 'status' && d.status === 'ended') {
      ended = true;
      endedAt = d.endedAt;
      ttl = d.expiresInMinutes;
      updateStatus();
    }
    else if (d.type === 'history') {
      d.segments.forEach(addLine);
    }
  };

  es.onerror = () => {
    es.close();
    if (!ended) {
      st.className = 'connecting';
      st.innerHTML = '<span>Reconnecting…</span>';
    }
    setTimeout(connect, 2000);
  };
}

connect();
setInterval(() => { updateDuration(); if (ended) updateStatus(); }, 10000);
</script>
</body></html>
