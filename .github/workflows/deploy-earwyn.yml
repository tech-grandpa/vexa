name: Deploy to Earwyn

on:
  push:
    branches: [feature/webex-platform, main]
    paths:
      - 'services/transcript-room/**'
      - 'services/vexa-bot/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-earwyn.yml'
  workflow_dispatch:

env:
  DEPLOY_DIR: /opt/earwyn

jobs:
  deploy:
    name: Deploy to Earwyn VM
    runs-on: [self-hosted, earwyn]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy transcript-room
        run: |
          set -e
          DEPLOY=${{ env.DEPLOY_DIR }}
          mkdir -p "$DEPLOY/services/transcript-room"

          # Copy transcript-room service files preserving expected path structure
          cp services/transcript-room/server.js services/transcript-room/viewer.html \
             services/transcript-room/package.json services/transcript-room/package-lock.json \
             services/transcript-room/Dockerfile \
             "$DEPLOY/services/transcript-room/"
          
          # Use earwyn-specific compose at root
          cp services/transcript-room/docker-compose.earwyn.yml "$DEPLOY/docker-compose.yml"

          cd "$DEPLOY"

          echo "=== Building ==="
          docker compose build

          echo "=== Starting ==="
          docker compose up -d

          echo "=== Health check ==="
          sleep 5
          curl -sf http://localhost:8790/health && echo " ✅ transcript-room healthy" || echo " ❌ transcript-room unhealthy"

          echo "=== Status ==="
          docker compose ps
