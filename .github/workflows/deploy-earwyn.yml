name: Deploy to Earwyn

on:
  push:
    branches: [feature/webex-platform, main]
    paths:
      - 'services/**'
      - 'libs/**'
      - 'docker-compose.earwyn.yml'
      - '.github/workflows/deploy-earwyn.yml'
  workflow_dispatch:

env:
  DEPLOY_DIR: /opt/earwyn

jobs:
  deploy:
    name: Deploy Vexa Stack to Earwyn
    runs-on: [self-hosted, earwyn]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync project to deploy dir
        run: |
          set -e
          DEPLOY=${{ env.DEPLOY_DIR }}
          mkdir -p "$DEPLOY"

          # Sync the entire repo (needed for monorepo builds with shared libs)
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '.venv' \
            --exclude 'hub' \
            ./ "$DEPLOY/"

          # Use earwyn-specific compose
          cp "$DEPLOY/docker-compose.earwyn.yml" "$DEPLOY/docker-compose.yml"

      - name: Verify .env exists
        run: |
          if [ ! -f "${{ env.DEPLOY_DIR }}/.env" ]; then
            echo "❌ .env file missing at ${{ env.DEPLOY_DIR }}/.env"
            echo "Create it from .env.earwyn.template with actual secrets"
            exit 1
          fi
          echo "✅ .env file found"

      - name: Build and deploy
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -e

          echo "=== Building images ==="
          docker compose build

          echo "=== Starting stack ==="
          docker compose up -d

          echo "=== Waiting for services ==="
          sleep 10

          echo "=== Health checks ==="
          # Transcript room
          curl -sf http://localhost:8790/health && echo " ✅ transcript-room" || echo " ❌ transcript-room"
          # API gateway
          curl -sf http://localhost:8056/docs >/dev/null 2>&1 && echo " ✅ api-gateway" || echo " ⚠️  api-gateway (may still be starting)"
          # Redis
          docker compose exec -T redis redis-cli ping | grep -q PONG && echo " ✅ redis" || echo " ❌ redis"
          # Postgres
          docker compose exec -T postgres pg_isready -U postgres && echo " ✅ postgres" || echo " ❌ postgres"

          echo ""
          echo "=== Service status ==="
          docker compose ps
